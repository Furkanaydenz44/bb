<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bulbana — İki Taraf</title>
<style>
:root{
  --label:#15161a; --label2:#5b5e66; --label3:#9a9ca5;
  --tint:#ea5b0c; --tint2:#fb8c2a; --tintsoft:rgba(234,91,12,.13);
  --glass:rgba(255,255,255,.6); --glassS:rgba(255,255,255,.74); --glassB:rgba(255,255,255,.7);
  --glassHi:inset 0 1px 0 rgba(255,255,255,.85); --chrome:rgba(255,255,255,.55);
  --sep:rgba(60,60,67,.13); --fill:rgba(120,120,130,.14); --fill2:rgba(120,120,130,.22);
  --shadow:0 14px 34px rgba(22,32,45,.12); --blue:#0a84ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,sans-serif;color:var(--label);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 700px at 12% -6%,#ffe9d6,transparent 46%),radial-gradient(1000px 700px at 110% 6%,#e2ebff,transparent 50%),linear-gradient(160deg,#eef1f6,#e6ebf1 60%,#dde3ec);min-height:100vh}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
img{display:block}

.head{text-align:center;padding:26px 16px 6px}
.head .logo{display:inline-flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.head .logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--tint2),var(--tint));display:grid;place-items:center;color:#fff}
.head h1{margin:0;font-size:26px;letter-spacing:-.03em}
.head p{margin:7px auto 0;font-size:14px;color:var(--label2);max-width:560px;line-height:1.5}
.head .arrow{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--tint);background:var(--tintsoft);padding:6px 13px;border-radius:999px}

.stage{display:flex;justify-content:center;align-items:flex-start;gap:34px;padding:14px 18px 54px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.plabel{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:750;letter-spacing:-.01em;padding:8px 15px;border-radius:999px;background:var(--glassS);box-shadow:var(--glassHi),var(--shadow)}
.plabel .who2{color:var(--label2);font-weight:600}
.plabel.buyer .tag{color:#0a6fd0}.plabel.seller .tag{color:var(--tint)}
.plabel .tag{font-weight:800}

/* phone */
.frame{position:relative;width:352px;height:720px;border-radius:56px;padding:12px;
  background:linear-gradient(150deg,#d6dde5,#9ba4ae 36%,#7e8893 62%,#b3bbc6);
  box-shadow:0 46px 90px -32px rgba(15,23,42,.55),0 2px 5px rgba(0,0,0,.28),inset 0 0 0 2px rgba(255,255,255,.3);
  transition:box-shadow .25s}
.frame:before{content:"";position:absolute;inset:5px;border-radius:51px;background:#000;z-index:1}
.frame.ring{box-shadow:0 0 0 4px var(--tint),0 0 34px 4px rgba(234,91,12,.5),0 46px 90px -32px rgba(15,23,42,.55)}
.device{position:absolute;inset:12px;border-radius:44px;overflow:hidden;z-index:2;display:flex;flex-direction:column;background:#eef1f4}
.device:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(60% 42% at 8% 4%,rgba(255,150,70,.34),transparent 60%),radial-gradient(56% 40% at 98% 2%,rgba(86,158,255,.32),transparent 58%),radial-gradient(60% 46% at 88% 102%,rgba(255,166,99,.26),transparent 60%),linear-gradient(180deg,#f1f4f7,#eaeff3)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;background:#000;border-radius:18px;z-index:60;display:flex;align-items:center;justify-content:flex-end;padding-right:12px}
.island:after{content:"";width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#3a4a66,#0a0f1c 70%)}
.statusbar{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:14px;font-weight:650;position:relative;z-index:5;color:var(--label)}
.statusbar .si{display:flex;align-items:center;gap:6px}

.chead{flex:none;position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:6px 16px 10px;background:var(--chrome);backdrop-filter:blur(26px) saturate(185%);-webkit-backdrop-filter:blur(26px) saturate(185%);box-shadow:0 .5px 0 var(--sep)}
.chead .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,#1d1e24,#3a3b45);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;flex:none}
.chead .nm{flex:1;min-width:0}
.chead .nm b{font-size:15px;letter-spacing:-.02em;display:block}
.chead .nm span{font-size:11.5px;color:var(--tint);font-weight:600}
.chead .newpill{font-size:10.5px;font-weight:800;color:#fff;background:var(--tint);padding:4px 9px;border-radius:999px;opacity:0;transform:scale(.6);transition:.2s}
.chead .newpill.show{opacity:1;transform:scale(1)}

.ctx{flex:none;position:relative;z-index:4;display:flex;align-items:center;gap:10px;margin:9px 12px 4px;padding:8px;border-radius:14px;background:var(--glassS);box-shadow:var(--glassHi),0 4px 14px rgba(0,0,0,.06)}
.ctx .ph{width:42px;height:42px;border-radius:10px;overflow:hidden;flex:none;position:relative;background:linear-gradient(150deg,#f4ead9,#d3e2f5);display:grid;place-items:center;font-size:20px}
.ctx .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ctx .t b{font-size:13px;letter-spacing:-.02em;display:block;line-height:1.15}
.ctx .t span{font-size:11.5px;color:var(--tint);font-weight:700}
.ctx .tag{margin-left:auto;font-size:10px;font-weight:800;color:var(--label2);background:var(--fill);padding:4px 8px;border-radius:999px}

.chat{flex:1;overflow-y:auto;padding:8px 13px 12px;position:relative;z-index:3;scrollbar-width:none;display:flex;flex-direction:column}
.chat::-webkit-scrollbar{display:none}
.bub{max-width:80%;padding:9px 12px;border-radius:18px;font-size:14px;line-height:1.34;margin-bottom:7px;word-wrap:break-word}
.bub.them{background:var(--glassS);backdrop-filter:blur(10px);color:var(--label);border-bottom-left-radius:5px;align-self:flex-start;box-shadow:var(--glassHi),0 3px 10px rgba(0,0,0,.05)}
.bub.me{background:linear-gradient(180deg,var(--tint2),var(--tint));color:#fff;border-bottom-right-radius:5px;align-self:flex-end;box-shadow:0 5px 14px rgba(234,91,12,.3)}
.sys{align-self:center;margin:6px 0 9px;font-size:11px;font-weight:600;color:var(--label2);background:var(--glass);backdrop-filter:blur(8px);padding:5px 12px;border-radius:999px;box-shadow:var(--glassHi);text-align:center}

.ocard{max-width:84%;border-radius:15px;padding:12px;margin-bottom:8px;background:var(--glassS);backdrop-filter:blur(12px);box-shadow:var(--glassHi),0 5px 16px rgba(0,0,0,.07);border:1px solid var(--glassB)}
.ocard.them{align-self:flex-start}
.ocard.me{align-self:flex-end;border-color:var(--tint);background:var(--tintsoft)}
.ocard small{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--tint)}
.ocard b{display:block;font-size:23px;letter-spacing:-.03em;margin:3px 0}
.ocard p{margin:0 0 9px;font-size:12px;color:var(--label2);line-height:1.35}
.ocard .st{font-size:11.5px;font-weight:700}
.ocard .st.acc{color:var(--tint)}.ocard .st.rej{color:#d11}
.ocard .obtns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.obtn{height:36px;border-radius:11px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.obtn.acc{background:linear-gradient(180deg,var(--tint2),var(--tint));color:#fff;box-shadow:0 6px 14px rgba(234,91,12,.3)}
.obtn.rej{background:var(--fill);color:var(--label)}

.composer{flex:none;position:relative;z-index:6;display:none;gap:8px;align-items:center;margin:0 12px;padding:9px 10px;border-radius:14px;background:var(--glassS);backdrop-filter:blur(20px);box-shadow:var(--glassHi),0 6px 18px rgba(0,0,0,.08)}
.composer.show{display:flex;animation:rise .22s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:translateY(0);opacity:1}}
.composer .lbl{font-size:13px;font-weight:700;white-space:nowrap}
.composer input{flex:1;min-width:0;height:38px;border-radius:11px;background:var(--fill);padding:0 12px;font-size:15px;outline:none}
.composer .ok{flex:none;height:38px;padding:0 14px;border-radius:11px;background:var(--tint);color:#fff;font-weight:700;font-size:13.5px}
.composer .x{flex:none;width:38px;height:38px;border-radius:11px;background:var(--fill);font-size:16px}

.inputbar{flex:none;position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:10px 12px 22px;background:var(--chrome);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px);box-shadow:0 -.5px 0 var(--sep)}
.teklifbtn{flex:none;background:var(--tintsoft);color:var(--tint);font-weight:800;font-size:13px;padding:9px 12px;border-radius:13px;white-space:nowrap}
.teklifbtn:active{transform:scale(.95)}
.inputbar input{flex:1;min-width:0;height:38px;border-radius:19px;background:var(--glass);box-shadow:var(--glassHi);padding:0 14px;font-size:15px;outline:none}
.send{flex:none;width:38px;height:38px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center}
.send:active{transform:scale(.9)}

.foot{text-align:center;color:var(--label3);font-size:12px;padding:0 16px 30px}
@media(max-width:780px){.frame{transform:scale(.92)}}
</style>
</head>
<body>
  <div class="head">
    <div class="logo"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></i>Bulbana</div>
    <h1>İki taraf · tek sohbet</h1>
    <p>Solda <b>alıcı</b>, sağda <b>satıcı</b> — aynı görüşme. Bir telefonda mesaj yaz ya da <b>teklif gönder</b>; diğer telefonda <b>anında</b> belirir ve telefon turuncu parlar.</p>
    <span class="arrow">⟵ canlı bağlı ⟶</span>
  </div>
  <div class="stage" id="phones"></div>
  <div class="foot">Bu bir görsel prototiptir — iki telefon da aynı sayfada, aynı sohbeti paylaşır.</div>

<script>
const TL = n => '₺' + Math.round(n).toLocaleString('tr-TR');
const CAM = 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=400&q=70';

const USERS = {
  ahmet:{name:'Ahmet Yıldız', handle:'ahmet_y', role:'ALICI', av:'A', cls:'buyer'},
  mehmet:{name:'Mehmet Demir', handle:'analog_mehmet', role:'SATICI', av:'M', cls:'seller'},
};
const PRODUCT = {title:'Leica M6 35mm film makinesi', sub:'Bütçe ₺45.000 – ₺65.000', emoji:'📷'};

let MSGS = [
  {from:'mehmet', t:'Merhaba Ahmet, "Leica M6" ilanını gördüm. Bende 1998 model, optikler tertemiz.'},
  {from:'ahmet', t:'Süper! Işık ölçer çalışıyor mu, kutu/fatura var mı?'},
  {from:'mehmet', t:'Ölçer kalibre, kutulu + faturalı. İstersen resmi teklif göndereyim.'},
];

function other(me){return me==='ahmet'?'mehmet':'ahmet';}

function phoneShell(me){
  const u=USERS[me], o=USERS[other(me)];
  return `<div class="col">
    <div class="plabel ${u.cls}"><span class="tag">${u.role}</span> <span class="who2">${u.name} · @${u.handle}</span></div>
    <div class="frame" id="frame-${me}">
      <div class="device">
        <div class="island"></div>
        <div class="statusbar"><span class="clock">9:41</span><span class="si">
          <svg width="17" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
          <svg width="24" height="12" viewBox="0 0 25 13" fill="none"><rect x="1" y="1" width="20" height="11" rx="3" stroke="currentColor" stroke-opacity=".4"/><rect x="2.6" y="2.6" width="15" height="7.8" rx="1.6" fill="currentColor"/></svg>
        </span></div>
        <div class="chead">
          <div class="av">${o.av}</div>
          <div class="nm"><b>${o.name}</b><span>@${o.handle} · çevrimiçi</span></div>
          <span class="newpill" id="new-${me}">● yeni</span>
        </div>
        <div class="ctx">
          <div class="ph"><span>${PRODUCT.emoji}</span><img src="${CAM}" onerror="this.remove()"></div>
          <div class="t"><b>${PRODUCT.title}</b><span>${PRODUCT.sub}</span></div>
          <span class="tag">İlan</span>
        </div>
        <div class="chat" id="chat-${me}"></div>
        <div class="composer" id="comp-${me}">
          <span class="lbl">₺</span>
          <input type="number" inputmode="numeric" id="price-${me}" placeholder="Teklif tutarı">
          <button class="ok" onclick="submitOffer('${me}')">Gönder</button>
          <button class="x" onclick="toggleComposer('${me}')">✕</button>
        </div>
        <div class="inputbar">
          <button class="teklifbtn" onclick="toggleComposer('${me}')">₺ Teklif Ver</button>
          <input id="in-${me}" placeholder="Mesaj yaz…" onkeydown="if(event.key==='Enter')send('${me}')">
          <button class="send" onclick="send('${me}')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderPhones(){
  document.getElementById('phones').innerHTML = phoneShell('ahmet') + phoneShell('mehmet');
  renderChats();
}

function renderChatFor(me){
  const el=document.getElementById('chat-'+me);
  el.innerHTML = MSGS.map((m,i)=>{
    if(m.from==='system') return `<div class="sys">${m.t}</div>`;
    if(m.offer!==undefined){
      const mine = m.from===me;
      let foot;
      if(m.status==='accepted') foot=`<div class="st acc">✓ ${USERS[m.to||other(m.from)].name.split(' ')[0]} kabul etti</div>`;
      else if(m.status==='rejected') foot=`<div class="st rej">✕ Reddedildi</div>`;
      else if(mine) foot=`<div class="st" style="color:var(--label3)">Gönderildi · yanıt bekleniyor</div>`;
      else foot=`<div class="obtns"><button class="obtn acc" onclick="actOffer(${i},'accept','${me}')">Kabul et</button><button class="obtn rej" onclick="actOffer(${i},'reject','${me}')">Reddet</button></div>`;
      return `<div class="ocard ${mine?'me':'them'}"><small>${mine?'Senin teklifin':USERS[m.from].name.split(' ')[0]+' teklif verdi'}</small><b>${TL(m.offer)}</b><p>${m.note||''}</p>${foot}</div>`;
    }
    return `<div class="bub ${m.from===me?'me':'them'}">${m.t}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}
function renderChats(){renderChatFor('ahmet');renderChatFor('mehmet');}

function flash(me){
  const f=document.getElementById('frame-'+me); if(f){f.classList.add('ring');}
  const b=document.getElementById('new-'+me); if(b){b.classList.add('show');}
  setTimeout(()=>{if(f)f.classList.remove('ring');if(b)b.classList.remove('show');},1200);
}

function send(me){
  const inp=document.getElementById('in-'+me); const t=inp.value.trim(); if(!t)return;
  MSGS.push({from:me, t}); inp.value='';
  renderChats(); flash(other(me));
}
function toggleComposer(me){
  const c=document.getElementById('comp-'+me); c.classList.toggle('show');
  if(c.classList.contains('show')) document.getElementById('price-'+me).focus();
}
function submitOffer(me){
  const v=document.getElementById('price-'+me).value.replace(/[^0-9]/g,'');
  const p=parseInt(v)||0;
  if(p<=0){document.getElementById('price-'+me).placeholder='Önce tutar gir!';return;}
  MSGS.push({from:me, to:other(me), offer:p, status:'pending', note:me==='mehmet'?'Leica M6 0.72 · kutulu + faturalı':'Bu fiyata alırım'});
  document.getElementById('price-'+me).value='';
  document.getElementById('comp-'+me).classList.remove('show');
  renderChats(); flash(other(me));
}
function actOffer(i, action, me){
  const m=MSGS[i]; if(!m||m.offer===undefined)return;
  m.status = action==='accept'?'accepted':'rejected'; m.to=me;
  MSGS.push({from:'system', t: action==='accept'
    ? `${USERS[me].name} teklifi kabul etti 🎉 — ${TL(m.offer)}`
    : `${USERS[me].name} teklifi reddetti.`});
  renderChats(); flash(other(me));
}

function clock(){const d=new Date();let h=d.getHours(),m=d.getMinutes();document.querySelectorAll('.clock').forEach(e=>e.textContent=h+':'+(m<10?'0':'')+m);}

renderPhones();
clock();setInterval(clock,15000);
</script>
</body>
</html>
